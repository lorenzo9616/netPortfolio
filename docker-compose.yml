# NOTE: Copy .env.example to .env and fill in real values before running.
# Never commit .env or real credentials to source control.

networks:
  ocr-network:
    driver: bridge

volumes:
  pgdata:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-ocrdb}
      POSTGRES_USER:     ${POSTGRES_USER:-ocruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ocr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocruser} -d ${POSTGRES_DB:-ocrdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-ocrdb};Username=${POSTGRES_USER:-ocruser};Password=${POSTGRES_PASSWORD:-changeme}
      - Auth__ApiKey=${BACKEND_API_KEY:-}
    networks:
      - ocr-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # aspnet:8.0-alpine has BusyBox wget but not curl
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      # Server-side (RSC/SSR) requests use the internal Docker service name.
      # NEXT_PUBLIC_API_URL is baked into the browser bundle and used client-side.
      - API_URL=http://backend:5000
    networks:
      - ocr-network
    depends_on:
      backend:
        condition: service_healthy

  ocr-service:
    build:
      context: ./ocr-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - ocr-network
    healthcheck:
      # python:3.11-slim has no curl/wget; use Python's built-in urllib instead
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
